<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCrypt - Professional Encryption Toolkit</title>
    <style>
        :root {
            --primary: #0a192f;
            --secondary: #172a45;
            --accent: #64ffda;
            --text: #ccd6f6;
            --text-secondary: #8892b0;
            --dark: #020c1b;
            --light: #e6f1ff;
            --error: #ff5555;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0;
            color: var(--light);
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--secondary);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            padding-bottom: 15px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin: 0;
            color: var(--light);
        }

        .card-icon {
            color: var(--accent);
            font-size: 1.5rem;
        }

        textarea, input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background-color: rgba(10, 25, 47, 0.5);
            border: 1px solid rgba(100, 255, 218, 0.1);
            color: var(--text);
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            margin-bottom: 0;
        }

        .btn {
            padding: 12px 20px;
            background-color: rgba(100, 255, 218, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: rgba(100, 255, 218, 0.2);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--primary);
            border: 1px solid var(--accent);
        }

        .btn-primary:hover {
            background-color: rgba(100, 255, 218, 0.9);
        }

        .result-container {
            margin-top: 20px;
        }

        .result-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-box {
            background-color: rgba(10, 25, 47, 0.7);
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            word-break: break-all;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background-color: rgba(100, 255, 218, 0.1);
            color: var(--accent);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 8px;
        }

        .status {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 10px;
            display: inline-block;
        }

        .status-success {
            background-color: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }

        .status-error {
            background-color: rgba(255, 85, 85, 0.1);
            color: var(--error);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Secure<span>Crypt</span></h1>
            <p class="subtitle">Professional-grade encryption and hashing toolkit</p>
        </header>

        <div class="grid">
            <!-- Input Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Input</h2>
                    <i class="card-icon fas fa-keyboard"></i>
                </div>
                <textarea id="message" placeholder="Enter text to encrypt/decrypt or hash..."></textarea>
                <div class="input-group">
                    <button class="btn" onclick="clearAll()">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                    <button class="btn" onclick="copyInput()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>

            <!-- Caesar Cipher Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Caesar Cipher <span class="badge">ROT13</span></h2>
                    <i class="card-icon fas fa-exchange-alt"></i>
                </div>
                <input type="number" id="caesarShift" value="3" placeholder="Shift value">
                <button class="btn" onclick="caesarEncrypt()">
                    <i class="fas fa-lock"></i> Encrypt
                </button>
                <button class="btn" onclick="caesarDecrypt()">
                    <i class="fas fa-lock-open"></i> Decrypt
                </button>
                <div class="result-container">
                    <span class="result-label">Result</span>
                    <div class="result-box" id="caesarResult"></div>
                </div>
            </div>

            <!-- Affine Cipher Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Affine Cipher <span class="badge">MATH</span></h2>
                    <i class="card-icon fas fa-project-diagram"></i>
                </div>
                <div class="input-group">
                    <input type="number" id="affineA" value="5" placeholder="Key A">
                    <input type="number" id="affineB" value="8" placeholder="Key B">
                </div>
                <button class="btn" onclick="affineEncrypt()">
                    <i class="fas fa-lock"></i> Encrypt
                </button>
                <button class="btn" onclick="affineDecrypt()">
                    <i class="fas fa-lock-open"></i> Decrypt
                </button>
                <div class="result-container">
                    <span class="result-label">Result</span>
                    <div class="result-box" id="affineResult"></div>
                </div>
            </div>

            <!-- Hash Functions Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Hash Functions <span class="badge">DIGEST</span></h2>
                    <i class="card-icon fas fa-fingerprint"></i>
                </div>
                <button class="btn" onclick="hashMD5()">
                    <i class="fas fa-hashtag"></i> MD5
                </button>
                <button class="btn" onclick="hashSHA256()">
                    <i class="fas fa-hashtag"></i> SHA-256
                </button>
                <div class="result-container" style="margin-top: 15px;">
                    <span class="result-label">MD5 Hash</span>
                    <div class="result-box" id="md5Result"></div>
                </div>
                <div class="result-container">
                    <span class="result-label">SHA-256 Hash</span>
                    <div class="result-box" id="sha256Result"></div>
                </div>
            </div>

            <!-- AES Encryption Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">AES Encryption <span class="badge">256-bit</span></h2>
                    <i class="card-icon fas fa-shield-alt"></i>
                </div>
                <input type="text" id="aesKey" placeholder="Enter secret key (16/24/32 chars)">
                <button class="btn btn-primary" onclick="encryptAES()">
                    <i class="fas fa-lock"></i> Encrypt
                </button>
                <button class="btn" onclick="decryptAES()">
                    <i class="fas fa-lock-open"></i> Decrypt
                </button>
                <div class="result-container">
                    <span class="result-label">Result</span>
                    <div class="result-box" id="aesResult"></div>
                    <div id="aesStatus" class="status" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        // Helper functions
        function clearAll() {
            document.getElementById("message").value = "";
            document.querySelectorAll(".result-box").forEach(el => el.textContent = "");
            document.getElementById("aesStatus").style.display = "none";
        }

        function copyInput() {
            const message = document.getElementById("message");
            message.select();
            document.execCommand("copy");
            showStatus("Copied to clipboard!", "status-success");
        }

        function showStatus(message, className) {
            const statusEl = document.createElement("div");
            statusEl.className = `status ${className}`;
            statusEl.textContent = message;
            document.body.appendChild(statusEl);
            setTimeout(() => statusEl.remove(), 3000);
        }

        // Caesar Cipher
        function caesarEncrypt() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const shift = parseInt(document.getElementById("caesarShift").value);
            let result = '';
            for (let i = 0; i < message.length; i++) {
                let char = message[i];
                if (char.match(/[a-z]/i)) {
                    const code = message.charCodeAt(i);
                    let shiftedCode;
                    if (code >= 65 && code <= 90) {
                        shiftedCode = ((code - 65 + shift) % 26) + 65;
                    } else if (code >= 97 && code <= 122) {
                        shiftedCode = ((code - 97 + shift) % 26) + 97;
                    }
                    result += String.fromCharCode(shiftedCode);
                } else {
                    result += char;
                }
            }
            document.getElementById("caesarResult").textContent = result;
            showStatus("Caesar encryption applied", "status-success");
        }

        function caesarDecrypt() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const shift = parseInt(document.getElementById("caesarShift").value);
            let result = '';
            for (let i = 0; i < message.length; i++) {
                let char = message[i];
                if (char.match(/[a-z]/i)) {
                    const code = message.charCodeAt(i);
                    let shiftedCode;
                    if (code >= 65 && code <= 90) {
                        shiftedCode = ((code - 65 - shift + 26) % 26) + 65;
                    } else if (code >= 97 && code <= 122) {
                        shiftedCode = ((code - 97 - shift + 26) % 26) + 97;
                    }
                    result += String.fromCharCode(shiftedCode);
                } else {
                    result += char;
                }
            }
            document.getElementById("caesarResult").textContent = result;
            showStatus("Caesar decryption applied", "status-success");
        }

        // Affine Cipher
        function affineEncrypt() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const a = parseInt(document.getElementById("affineA").value);
            const b = parseInt(document.getElementById("affineB").value);
            const m = 26;
            if (gcd(a, m) !== 1) {
                showStatus("Coefficient 'a' must be coprime with 26", "status-error");
                return;
            }
            let result = '';
            for (let i = 0; i < message.length; i++) {
                let char = message[i];
                if (char.match(/[a-zA-Z]/)) {
                    let code = char.toUpperCase().charCodeAt(0) - 65;
                    let encrypted = (a * code + b) % m;
                    result += String.fromCharCode(encrypted + 65);
                } else {
                    result += char;
                }
            }
            document.getElementById("affineResult").textContent = result;
            showStatus("Affine encryption applied", "status-success");
        }

        function affineDecrypt() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const a = parseInt(document.getElementById("affineA").value);
            const b = parseInt(document.getElementById("affineB").value);
            const m = 26;
            if (gcd(a, m) !== 1) {
                showStatus("Coefficient 'a' must be coprime with 26", "status-error");
                return;
            }
            let aInverse = modInverse(a, m);
            let result = '';
            for (let i = 0; i < message.length; i++) {
                let char = message[i];
                if (char.match(/[a-zA-Z]/)) {
                    let code = char.toUpperCase().charCodeAt(0) - 65;
                    let decrypted = (aInverse * (code - b + m)) % m;
                    result += String.fromCharCode(decrypted + 65);
                } else {
                    result += char;
                }
            }
            document.getElementById("affineResult").textContent = result;
            showStatus("Affine decryption applied", "status-success");
        }

        function gcd(a, b) {
            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        function modInverse(a, m) {
            a = a % m;
            for (let x = 1; x < m; x++) {
                if ((a * x) % m === 1) {
                    return x;
                }
            }
            return -1;
        }

        // MD5 Hashing
        function hashMD5() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const hash = CryptoJS.MD5(message).toString(CryptoJS.enc.Hex);
            document.getElementById("md5Result").textContent = hash;
            showStatus("MD5 hash generated", "status-success");
        }

        // SHA-256 Hashing
        function hashSHA256() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const hash = CryptoJS.SHA256(message).toString(CryptoJS.enc.Hex);
            document.getElementById("sha256Result").textContent = hash;
            showStatus("SHA-256 hash generated", "status-success");
        }

        // AES Encryption/Decryption
        function encryptAES() {
            const message = document.getElementById("message").value;
            if (!message) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const key = document.getElementById("aesKey").value;
            if (!key) {
                showStatus("Please enter an AES key", "status-error");
                return;
            }
            const ciphertext = CryptoJS.AES.encrypt(message, key).toString();
            document.getElementById("aesResult").textContent = ciphertext;
            const statusEl = document.getElementById("aesStatus");
            statusEl.textContent = "Encryption successful";
            statusEl.className = "status status-success";
            statusEl.style.display = "block";
        }

        function decryptAES() {
            const ciphertext = document.getElementById("message").value;
            if (!ciphertext) {
                showStatus("Please enter a message first", "status-error");
                return;
            }
            const key = document.getElementById("aesKey").value;
            if (!key) {
                showStatus("Please enter an AES key", "status-error");
                return;
            }
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, key);
                const plaintext = bytes.toString(CryptoJS.enc.Utf8);
                if (!plaintext) {
                    throw new Error("Decryption failed");
                }
                document.getElementById("aesResult").textContent = plaintext;
                const statusEl = document.getElementById("aesStatus");
                statusEl.textContent = "Decryption successful";
                statusEl.className = "status status-success";
                statusEl.style.display = "block";
            } catch (e) {
                const statusEl = document.getElementById("aesStatus");
                statusEl.textContent = "Decryption failed - invalid key or ciphertext";
                statusEl.className = "status status-error";
                statusEl.style.display = "block";
            }
        }
    </script>
</body>
</html>
